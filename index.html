<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>海悦公馆社区 · 智慧社区服务平台（居民端）</title>
<style>
/* ================= 基础与适老化重置 ================= */
:root {
  --primary: #2563eb; --primary-light: #eff6ff; --bg: #f3f6fa; --text-main: #1e293b;
  --text-muted: #64748b; --border: #e2e8f0; --success: #10b981; --warning: #f59e0b;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  font-size: 18px; line-height: 1.6; color: var(--text-main);
  background-color: var(--bg); height: 100vh; display: flex; overflow: hidden;
}
/* 侧边导航栏 (电脑端显示) */
.sidebar { width: 260px; background: #1e293b; color: white; display: flex; flex-direction: column; padding: 24px 0; z-index: 10; flex-shrink: 0; }
.brand { font-size: 24px; font-weight: bold; text-align: center; margin-bottom: 40px; color: #e2e8f0; }
.nav-item { padding: 16px 30px; font-size: 20px; cursor: pointer; display: flex; align-items: center; gap: 12px; color: #94a3b8; transition: 0.2s;}
.nav-item:hover, .nav-item.active { background: rgba(255,255,255,0.1); color: white; border-left: 4px solid #3b82f6; }
/* 主内容区 */
.main-content { flex: 1; display: flex; flex-direction: column; overflow-y: auto; padding: 24px 32px; width: 100%; }
.top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
.page-title { font-size: 32px; font-weight: bold; transition: 0.3s; }
/* 数据卡片网格 */
.stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 24px; }
.stat-card { background: white; padding: 24px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.03); border: 1px solid var(--border); }
.stat-card .title { font-size: 16px; color: var(--text-muted); margin-bottom: 8px; }
.stat-card .value { font-size: 36px; font-weight: bold; color: var(--primary); }
.stat-card .desc { font-size: 14px; color: var(--success); margin-top: 8px; }
/* 布局分栏 */
.dashboard-layout { display: grid; grid-template-columns: 1.5fr 1fr; gap: 24px; flex: 1; }
.left-panel { display: flex; flex-direction: column; gap: 24px; }
.card { background: white; border-radius: 16px; padding: 24px; box-shadow: 0 4px 20px rgba(0,0,0,0.03); border: 1px solid var(--border); }
.card-title { font-size: 22px; font-weight: bold; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
.card-title::before { content: ""; width: 6px; height: 24px; background: var(--primary); border-radius: 4px; }
/* 公告 */
.notice-bar { background: #fffbeb; border: 1px solid #fde68a; color: #92400e; padding: 16px 20px; border-radius: 12px; font-size: 18px; display: flex; align-items: center; gap: 12px; }
.notice-tag { background: #f59e0b; color: white; padding: 2px 10px; border-radius: 6px; font-size: 14px; font-weight: bold; white-space: nowrap;}
/* 快捷服务 */
.service-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
.service-btn { background: var(--bg); padding: 20px 10px; border-radius: 12px; text-align: center; cursor: pointer; transition: 0.2s; font-size: 18px; font-weight: bold; color: var(--text-main); }
.service-btn:hover { background: var(--primary-light); color: var(--primary); transform: translateY(-2px); }
.service-btn .icon { font-size: 32px; margin-bottom: 8px; display: block; }
/* 报修表单 */
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
.form-group { display: flex; flex-direction: column; gap: 8px; }
.form-group label { font-size: 18px; font-weight: bold; }
.form-group input, .form-group select, .form-group textarea { width: 100%; padding: 16px; font-size: 18px; border: 1px solid var(--border); border-radius: 10px; font-family: inherit; background: #f8fafc; }
.form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline: none; border-color: var(--primary); background: white; box-shadow: 0 0 0 3px var(--primary-light); }
.btn-submit { background: var(--primary); color: white; border: none; padding: 18px; font-size: 20px; font-weight: bold; border-radius: 12px; cursor: pointer; width: 100%; transition: 0.3s; }
.btn-submit:hover { background: #1d4ed8; box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4); }
/* 工单列表 */
.task-list { display: flex; flex-direction: column; gap: 16px; max-height: 500px; overflow-y: auto; padding-right: 10px;}
.task-item { border: 1px solid var(--border); padding: 16px; border-radius: 12px; background: #f8fafc; }
.task-header { display: flex; justify-content: space-between; margin-bottom: 10px; }
.task-tag { font-size: 14px; padding: 2px 10px; border-radius: 6px; font-weight: bold; }
.tag-pending { background: #fef3c7; color: #b45309; }
.tag-processing { background: #dbeafe; color: #1d4ed8; }
.tag-done { background: #d1fae5; color: #047857; }
.task-title { font-size: 20px; font-weight: bold; margin-bottom: 8px; }
.task-meta { font-size: 16px; color: var(--text-muted); margin-bottom: 12px; }
/* AI 助手 */
.ai-float-btn { position: fixed; right: 30px; bottom: 30px; width: 70px; height: 70px; background: linear-gradient(135deg, #3b82f6, #8b5cf6); border-radius: 50%; display: flex; justify-content: center; align-items: center; color: white; font-size: 32px; cursor: pointer; box-shadow: 0 10px 25px rgba(59,130,246,0.4); z-index: 100; transition: 0.3s; }
.ai-float-btn:hover { transform: scale(1.1) rotate(10deg); }
.ai-panel { position: fixed; right: 30px; bottom: 110px; width: 400px; height: 550px; background: white; border-radius: 20px; box-shadow: 0 20px 50px rgba(0,0,0,0.15); display: flex; flex-direction: column; overflow: hidden; z-index: 100; border: 1px solid var(--border); display: none; }
.ai-panel.active { display: flex; }
.ai-header { background: linear-gradient(135deg, #3b82f6, #8b5cf6); color: white; padding: 20px; font-size: 20px; font-weight: bold; display: flex; justify-content: space-between; }
.ai-close { cursor: pointer; font-size: 24px; }
.ai-chat-area { flex: 1; padding: 20px; overflow-y: auto; background: #f8fafc; display: flex; flex-direction: column; gap: 16px; }
.msg { max-width: 80%; padding: 12px 16px; border-radius: 12px; font-size: 16px; }
.msg.ai { background: white; border: 1px solid var(--border); align-self: flex-start; border-bottom-left-radius: 4px; }
.msg.user { background: var(--primary); color: white; align-self: flex-end; border-bottom-right-radius: 4px; }
.ai-input-area { padding: 16px; border-top: 1px solid var(--border); display: flex; gap: 10px; background: white; }
.ai-input { flex: 1; padding: 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 16px; outline: none; }
.ai-send { background: var(--primary); color: white; border: none; padding: 0 20px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }

/* ================= 📱 手机端响应式适配 ================= */
@media (max-width: 768px) {
  body { display: block; height: auto; overflow-y: auto; }
  .sidebar { display: none; } /* 手机端隐藏左侧菜单 */
  .main-content { padding: 16px; }
  .top-bar { flex-direction: column; align-items: flex-start; gap: 10px; margin-bottom: 16px; }
  .page-title { font-size: 24px; }
  .stats-grid { grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
  .stat-card { padding: 16px; }
  .stat-card .value { font-size: 28px; }
  .dashboard-layout { display: flex; flex-direction: column; gap: 16px; }
  .card { padding: 16px; margin-bottom: 16px; }
  .service-grid { grid-template-columns: 1fr 1fr; gap: 10px; }
  .form-row { grid-template-columns: 1fr; gap: 12px; margin-bottom: 12px; }
  .form-group input, .form-group select, .form-group textarea { padding: 12px; font-size: 16px; }
  .notice-bar { font-size: 16px; padding: 12px; }
  .ai-float-btn { width: 56px; height: 56px; font-size: 26px; right: 16px; bottom: 16px; }
  .ai-panel { width: calc(100% - 32px); right: 16px; bottom: 80px; height: 60vh; }
  .task-list { max-height: none; }
}
</style>
</head>
<body>

  <div class="sidebar">
    <div class="brand">🏘️ 海悦公馆社区</div>
    <div class="nav-item active" onclick="selectMenu(this, '智慧社区服务平台（居民端）')">🏠 首页看板</div>
    <div class="nav-item" onclick="selectMenu(this, '社区公告')">📢 社区公告</div>
    <div class="nav-item" onclick="selectMenu(this, '报修服务')">🔧 报修服务</div>
    <div class="nav-item" onclick="selectMenu(this, '邻里互助')">💬 邻里互助</div>
  </div>

  <div class="main-content">
    <div class="top-bar">
      <div class="page-title" id="pageTitle">智慧社区服务平台（居民端）</div>
      <div style="font-size: 16px; color: var(--text-muted);">欢迎您，张大爷 👴</div>
    </div>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="title">待处理报修</div>
        <div class="value" id="stat-pending" style="color: var(--warning);">0</div>
        <div class="desc">物业加紧处理中</div>
      </div>
      <div class="stat-card">
        <div class="title">已完成工单</div>
        <div class="value" id="stat-done" style="color: var(--success);">0</div>
        <div class="desc">感谢您的反馈</div>
      </div>
      <div class="stat-card">
        <div class="title">在住居民</div>
        <div class="value">1,240</div>
        <div class="desc">共 450 户</div>
      </div>
      <div class="stat-card">
        <div class="title">AI 管家</div>
        <div class="value" style="color: #8b5cf6;">在线</div>
        <div class="desc">右下角随时提问</div>
      </div>
    </div>

    <div class="dashboard-layout">
      <div class="left-panel">
        <div class="notice-bar">
          <span class="notice-tag">最新通知</span>
          <div style="overflow: hidden; white-space: nowrap;" id="notice-text">加载公告中...</div>
        </div>

        <div class="card">
          <div class="card-title">便捷生活服务</div>
          <div class="service-grid">
            <div class="service-btn"><span class="icon">🚰</span>水电缴费</div>
            <div class="service-btn"><span class="icon">📦</span>快递代收</div>
            <div class="service-btn"><span class="icon">🏥</span>社区医院</div>
            <div class="service-btn"><span class="icon">🛒</span>周边团购</div>
          </div>
        </div>

        <div class="card">
          <div class="card-title">快速提交问题</div>
          <form id="reportForm">
            <div class="form-row">
              <div class="form-group">
                <label>问题类型</label>
                <select id="form-category">
                  <option value="公共设施">公共设施报修</option>
                  <option value="个人报修">个人居家报修</option>
                  <option value="环境投诉">环境卫生投诉</option>
                </select>
              </div>
              <div class="form-group">
                <label>详细位置</label>
                <input type="text" id="form-location" placeholder="例如：3号楼2单元电梯" required>
              </div>
            </div>
            
            <div class="form-row">
              <div class="form-group">
                <label>联系电话</label>
                <input type="tel" id="form-phone" placeholder="请输入您的手机号" value="13800138000" required>
              </div>
              <div class="form-group">
                <label>联系人</label>
                <input type="text" id="form-contact" placeholder="您的称呼" value="张大爷" required>
              </div>
            </div>

            <div class="form-group" style="margin-bottom: 20px;">
              <label>问题描述</label>
              <textarea id="form-desc" rows="3" placeholder="请详细描述您遇到的问题..." required></textarea>
            </div>
            <button type="submit" class="btn-submit" id="submitBtn">立即上报</button>
          </form>
        </div>
      </div>

      <div class="left-panel">
        <div class="card" style="height: 100%;">
          <div class="card-title">我的上报记录</div>
          <div class="task-list" id="task-list">
            <!-- 动态渲染 -->
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="ai-float-btn" onclick="toggleAI()">🤖</div>
  <div class="ai-panel" id="aiPanel">
    <div class="ai-header">
      <span>✨ 社区AI智能管家</span>
      <span class="ai-close" onclick="toggleAI()">×</span>
    </div>
    <div class="ai-chat-area" id="chatArea">
      <div class="msg ai">您好！我是社区AI管家，您可以问我停水通知、物业费缴纳或直接报修。</div>
    </div>
    <div class="ai-input-area">
      <input type="text" class="ai-input" id="aiInput" placeholder="请输入问题..." onkeypress="if(event.key==='Enter') sendMsg()">
      <button class="ai-send" onclick="sendMsg()">发送</button>
    </div>
  </div>

<script>
// ====== 填写你的 Supabase 信息 ======
const SUPABASE_URL = 'https://sdelfnsqkxlqqbirkzds.supabase.co';
const SUPABASE_KEY = 'sb_publishable_4J-OF-nVY5dt-qxr5SreXQ_EWWxBt1X';// ===================================
// ===================================

function selectMenu(element, title) {
    document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
    element.classList.add('active');
    document.getElementById('pageTitle').innerText = title;
}

async function api(table, method = 'GET', body = null, query = '') {
  const url = `${SUPABASE_URL}/rest/v1/${table}${query}`;
  const opt = {
    method,
    headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY, 'Content-Type': 'application/json', 'Prefer': 'return=representation' }
  };
  if (body) opt.body = JSON.stringify(body);
  const res = await fetch(url, opt);
  if (!res.ok) throw new Error(await res.text());
  return method === 'POST' ? await res.json() : (method === 'GET' ? await res.json() : null);
}

function formatTime(dateStr) {
  const d = new Date(dateStr);
  return `${d.getMonth()+1}月${d.getDate()}日 ${d.getHours()}:${d.getMinutes().toString().padStart(2,'0')}`;
}

async function loadNotices() {
  try {
    const data = await api('notices', 'GET', null, '?select=*&order=created_at.desc&limit=1');
    if (data && data.length > 0) {
      document.getElementById('notice-text').innerText = `${data[0].title} - ${data[0].content}`;
    } else {
      document.getElementById('notice-text').innerText = '暂无最新公告';
    }
  } catch (e) { console.error('公告加载失败', e); }
}

async function loadTasks() {
  try {
    const data = await api('issues', 'GET', null, '?select=*&order=created_at.desc');
    
    document.getElementById('stat-pending').innerText = data.filter(t => t.status === 'pending').length;
    document.getElementById('stat-done').innerText = data.filter(t => t.status === 'done').length;

    const list = document.getElementById('task-list');
    if (data.length === 0) {
      list.innerHTML = '<div style="text-align:center; color:#94a3b8; padding: 20px;">您还没有提交过报修</div>';
      return;
    }
    
    list.innerHTML = data.map(t => {
      let tagCls = t.status === 'pending' ? 'tag-pending' : (t.status === 'processing' ? 'tag-processing' : 'tag-done');
      let tagText = t.status === 'pending' ? '待处理' : (t.status === 'processing' ? '处理中' : '已完成');
      return `
        <div class="task-item">
          <div class="task-header">
            <span class="task-tag ${tagCls}">${tagText}</span>
            <span style="font-size: 14px; color: var(--text-muted);">${formatTime(t.created_at)}</span>
          </div>
          <div class="task-title">${t.category} - ${t.location}</div>
          <div class="task-meta">${t.description}</div>
          ${t.reply ? `<div style="background:#f0fdf4; border-left:3px solid #15803d; padding:8px 12px; font-size:15px; color:#166534; border-radius:4px;"><b>物业回复：</b>${t.reply}</div>` : ''}
        </div>
      `;
    }).join('');
  } catch (e) { console.error('工单加载失败', e); }
}

document.getElementById('reportForm').addEventListener('submit', async function(e) {
  e.preventDefault();
  const btn = document.getElementById('submitBtn');
  btn.disabled = true; btn.innerText = '提交中...';

  const newIssue = {
    kind: 'public',
    category: document.getElementById('form-category').value,
    location: document.getElementById('form-location').value,
    title: '居民报修',
    description: document.getElementById('form-desc').value,
    phone: document.getElementById('form-phone').value,
    contact: document.getElementById('form-contact').value,
    status: 'pending'
  };

  try {
    await api('issues', 'POST', [newIssue]);
    alert('✅ 上报成功！物业已收到您的工单。');
    this.reset();
    loadTasks();
  } catch (err) {
    alert('提交失败，请检查网络。');
    console.error(err);
  } finally {
    btn.disabled = false; btn.innerText = '立即上报';
  }
});

function toggleAI() { document.getElementById('aiPanel').classList.toggle('active'); }
function sendMsg() {
  const input = document.getElementById('aiInput');
  const text = input.value.trim();
  if(!text) return;

  const chatArea = document.getElementById('chatArea');
  const userMsg = document.createElement('div');
  userMsg.className = 'msg user';
  userMsg.textContent = text;
  chatArea.appendChild(userMsg);
  input.value = '';

  setTimeout(async () => {
    const aiMsg = document.createElement('div');
    aiMsg.className = 'msg ai';
    if(text.includes('通知') || text.includes('公告')) {
      try {
        const data = await api('notices', 'GET', null, '?select=*&order=created_at.desc&limit=1');
        if(data.length > 0) {
          aiMsg.innerHTML = `为您找到最新公告：<br><b>${data[0].title}</b><br>${data[0].content}`;
        } else {
          aiMsg.innerHTML = '目前暂无最新社区公告哦。';
        }
      } catch(e) { aiMsg.innerHTML = '公告查询失败。'; }
    } else if(text.includes('报修') || text.includes('坏了')) {
      aiMsg.innerHTML = '请您在左侧的【快速提交问题】中填写具体位置和情况，提交后物业会立刻接单处理！🛠️';
    } else {
      aiMsg.innerHTML = '收到您的消息！我是演示版AI管家，您可以尝试问我“最新通知”。😊';
    }
    chatArea.appendChild(aiMsg);
    chatArea.scrollTop = chatArea.scrollHeight;
  }, 600);
  chatArea.scrollTop = chatArea.scrollHeight;
}

loadNotices();
loadTasks();
</script>
</body>
</html>
