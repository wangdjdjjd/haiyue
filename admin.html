<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>海悦公馆社区 · 智慧社区服务平台（管理端）</title>
<style>
/* ================= 基础与适老化重置 ================= */
:root {
  --primary: #2563eb; --primary-light: #eff6ff; --bg: #f3f6fa; --text-main: #1e293b;
  --text-muted: #64748b; --border: #e2e8f0; --success: #10b981; --warning: #f59e0b;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  font-size: 18px; line-height: 1.6; color: var(--text-main);
  background-color: var(--bg); height: 100vh; display: flex; overflow: hidden;
}
/* 侧边导航栏 */
.sidebar { width: 260px; background: #1e293b; color: white; display: flex; flex-direction: column; padding: 24px 0; z-index: 10; }
.brand { font-size: 24px; font-weight: bold; text-align: center; margin-bottom: 40px; color: #e2e8f0; }
.nav-item { padding: 16px 30px; font-size: 20px; cursor: pointer; display: flex; align-items: center; gap: 12px; color: #94a3b8; transition: 0.2s;}
.nav-item:hover, .nav-item.active { background: rgba(255,255,255,0.1); color: white; border-left: 4px solid #3b82f6; }
/* 主内容区 */
.main-content { flex: 1; display: flex; flex-direction: column; overflow-y: auto; padding: 24px 32px; }
.top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
.page-title { font-size: 32px; font-weight: bold; transition: 0.3s;}
/* 数据卡片网格 */
.stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 24px; }
.stat-card { background: white; padding: 24px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.03); border: 1px solid var(--border); }
.stat-card .title { font-size: 16px; color: var(--text-muted); margin-bottom: 8px; }
.stat-card .value { font-size: 36px; font-weight: bold; color: var(--primary); }
.stat-card .desc { font-size: 14px; color: var(--success); margin-top: 8px; }
/* 布局分栏 */
.dashboard-layout { display: grid; grid-template-columns: 1fr 1.5fr; gap: 24px; flex: 1; }
.left-panel { display: flex; flex-direction: column; gap: 24px; }
.card { background: white; border-radius: 16px; padding: 24px; box-shadow: 0 4px 20px rgba(0,0,0,0.03); border: 1px solid var(--border); }
.card-title { font-size: 22px; font-weight: bold; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
.card-title::before { content: ""; width: 6px; height: 24px; background: var(--primary); border-radius: 4px; }
/* 快捷服务 */
.service-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
.service-btn { background: var(--bg); padding: 20px 10px; border-radius: 12px; text-align: center; cursor: pointer; transition: 0.2s; font-size: 18px; font-weight: bold; color: var(--text-main); }
.service-btn:hover { background: var(--primary-light); color: var(--primary); transform: translateY(-2px); }
.service-btn .icon { font-size: 32px; margin-bottom: 8px; display: block; }
/* 表单 */
.form-group { display: flex; flex-direction: column; gap: 8px; }
.form-group label { font-size: 18px; font-weight: bold; }
.form-group input, .form-group textarea { width: 100%; padding: 16px; font-size: 18px; border: 1px solid var(--border); border-radius: 10px; font-family: inherit; background: #f8fafc; }
.form-group input:focus, .form-group textarea:focus { outline: none; border-color: var(--primary); background: white; box-shadow: 0 0 0 3px var(--primary-light); }
.btn-submit { background: var(--primary); color: white; border: none; padding: 18px; font-size: 20px; font-weight: bold; border-radius: 12px; cursor: pointer; width: 100%; transition: 0.3s; }
.btn-submit:hover { background: #1d4ed8; }
/* 工单列表 */
.task-list { display: flex; flex-direction: column; gap: 16px; max-height: 600px; overflow-y: auto; padding-right: 10px;}
.task-item { border: 1px solid var(--border); padding: 16px; border-radius: 12px; background: #f8fafc; }
.task-header { display: flex; justify-content: space-between; margin-bottom: 10px; }
.task-tag { font-size: 14px; padding: 2px 10px; border-radius: 6px; font-weight: bold; }
.tag-pending { background: #fef3c7; color: #b45309; }
.tag-processing { background: #dbeafe; color: #1d4ed8; }
.tag-done { background: #d1fae5; color: #047857; }
.task-title { font-size: 20px; font-weight: bold; margin-bottom: 8px; }
.task-meta { font-size: 16px; color: var(--text-muted); margin-bottom: 12px; }
.task-actions { display: flex; gap: 10px; margin-top: 10px;}
.btn-small { padding: 8px 16px; font-size: 16px; border-radius: 8px; cursor: pointer; border: none; font-weight: bold;}
.btn-primary { background: var(--primary); color: white; }
.btn-success { background: var(--success); color: white; }
.btn-outline { background: white; border: 1px solid var(--border); color: var(--text-main); }
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
</style>
</head>
<body>

  <div class="sidebar">
    <div class="brand">🛠️ 海悦公馆物业</div>
    <!-- 增加了点击事件 -->
    <div class="nav-item active" onclick="selectMenu(this, '业务数据看板')">📊 业务看板</div>
    <div class="nav-item" onclick="selectMenu(this, '公告管理')">📢 公告管理</div>
    <div class="nav-item" onclick="selectMenu(this, '居民档案')">👥 居民档案</div>
    <div class="nav-item" onclick="selectMenu(this, '系统设置')">⚙️ 系统设置</div>
  </div>

  <div class="main-content">
    <div class="top-bar">
      <div class="page-title" id="pageTitle">业务数据看板</div>
      <div style="font-size: 18px; color: var(--text-muted);">欢迎您，物业管理员 💼</div>
    </div>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="title">待处理工单</div>
        <div class="value" id="stat-pending" style="color: var(--warning);">0</div>
        <div class="desc">请尽快派单</div>
      </div>
      <div class="stat-card">
        <div class="title">已完成工单</div>
        <div class="value" id="stat-done" style="color: var(--success);">0</div>
      </div>
      <div class="stat-card">
        <div class="title">社区在住居民</div>
        <div class="value">1,240</div>
      </div>
      <div class="stat-card">
        <div class="title">系统状态</div>
        <div class="value" style="color: var(--success);">正常</div>
        <div class="desc">云数据库已连接</div>
      </div>
    </div>

    <div class="dashboard-layout">
      <!-- 左侧：操作区 -->
      <div class="left-panel">
        <div class="card">
          <div class="card-title">发布社区公告</div>
          <form id="noticeForm">
            <div class="form-group" style="margin-bottom: 16px;">
              <label>公告标题</label>
              <input type="text" id="notice-title" placeholder="例如：小区周末停水通知" required>
            </div>
            <div class="form-group" style="margin-bottom: 20px;">
              <label>公告内容</label>
              <textarea id="notice-content" rows="3" placeholder="请输入详细通知内容..." required></textarea>
            </div>
            <button type="submit" class="btn-submit" id="noticeBtn">发布公告</button>
          </form>
        </div>

        <div class="card" style="flex: 1;">
          <div class="card-title">快捷管理</div>
          <div class="service-grid">
            <div class="service-btn"><span class="icon">👥</span>人员管理</div>
            <div class="service-btn"><span class="icon">📊</span>导出报表</div>
            <div class="service-btn"><span class="icon">📝</span>工单统计</div>
            <div class="service-btn"><span class="icon">🔧</span>设施维护</div>
          </div>
        </div>
      </div>
      
      <!-- 右侧：工单区 -->
      <div class="left-panel">
        <div class="card" style="height: 100%;">
          <div class="card-title">居民待办工单</div>
          <div class="task-list" id="admin-task-list">
            <!-- 动态渲染 -->
          </div>
        </div>
      </div>
    </div>
  </div>

<script>
// ====== 填写你的 Supabase 信息 ======
const SUPABASE_URL = 'https://sdelfnsqkxlqqbirkzds.supabase.co';
const SUPABASE_KEY = 'sb_publishable_4J-OF-nVY5dt-qxr5SreXQ_EWWxBt1X';// ===================================
// ===================================

// 左侧菜单点击切换效果
function selectMenu(element, title) {
    document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
    element.classList.add('active');
    document.getElementById('pageTitle').innerText = title;
}

// 原生 Fetch API 封装
async function api(table, method = 'GET', body = null, query = '') {
  const url = `${SUPABASE_URL}/rest/v1/${table}${query}`;
  const opt = {
    method,
    headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY, 'Content-Type': 'application/json', 'Prefer': 'return=representation' }
  };
  if (body) opt.body = JSON.stringify(body);
  const res = await fetch(url, opt);
  if (!res.ok) throw new Error(await res.text());
  return method === 'DELETE' ? null : (res.status === 204 ? null : await res.json());
}

// 格式化时间
function formatTime(dateStr) {
  const d = new Date(dateStr);
  return `${d.getMonth()+1}月${d.getDate()}日 ${d.getHours()}:${d.getMinutes().toString().padStart(2,'0')}`;
}

// 加载工单
async function loadTasks() {
  try {
    const data = await api('issues', 'GET', null, '?select=*&order=created_at.desc');
    
    document.getElementById('stat-pending').innerText = data.filter(t => t.status === 'pending').length;
    document.getElementById('stat-done').innerText = data.filter(t => t.status === 'done').length;

    const list = document.getElementById('admin-task-list');
    if (data.length === 0) {
      list.innerHTML = '<div style="text-align:center; color:#94a3b8; padding: 20px;">当前没有待办工单</div>';
      return;
    }
    
    list.innerHTML = data.map(t => {
      let tagCls = t.status === 'pending' ? 'tag-pending' : (t.status === 'processing' ? 'tag-processing' : 'tag-done');
      let tagText = t.status === 'pending' ? '待处理' : (t.status === 'processing' ? '处理中' : '已完成');
      
      let actionBtns = '';
      if (t.status === 'pending') {
        actionBtns = `<button class="btn-small btn-primary" onclick="updateStatus('${t.id}', 'processing')">接单派工</button>`;
      } else if (t.status === 'processing') {
        actionBtns = `
          <button class="btn-small btn-success" onclick="updateStatus('${t.id}', 'done')">标记完成</button>
          <button class="btn-small btn-outline" onclick="replyTask('${t.id}')">回复居民</button>
        `;
      } else {
        actionBtns = `<span style="color:var(--success); font-size:16px; font-weight:bold; padding: 8px 0;">✓ 已办结</span>`;
      }

      return `
        <div class="task-item" style="border-left: 4px solid ${t.status === 'pending' ? 'var(--warning)' : (t.status === 'processing' ? 'var(--primary)' : 'var(--success)')};">
          <div class="task-header">
            <span class="task-tag ${tagCls}">${tagText}</span>
            <span style="font-size: 14px; color: var(--text-muted);">${formatTime(t.created_at)}</span>
          </div>
          <div class="task-title">${t.category} - ${t.location}</div>
          <div class="task-meta">联系人：${t.contact} | ${t.description}</div>
          ${t.reply ? `<div style="background:#f0fdf4; border-left:3px solid #15803d; padding:8px 12px; font-size:15px; color:#166534; border-radius:4px; margin-bottom:10px;"><b>物业回复：</b>${t.reply}</div>` : ''}
          <div class="task-actions">${actionBtns}</div>
        </div>
      `;
    }).join('');
  } catch (e) { console.error('工单加载失败', e); }
}

// 更新工单状态
async function updateStatus(id, newStatus) {
  try {
    await api('issues', 'PATCH', { status: newStatus }, `?id=eq.${id}`);
    loadTasks();
  } catch (err) {
    alert('操作失败：' + err.message);
  }
}

// 回复工单
async function replyTask(id) {
  const reply = prompt('请输入回复内容：');
  if (reply === null || reply.trim() === '') return;
  try {
    await api('issues', 'PATCH', { reply: reply.trim() }, `?id=eq.${id}`);
    loadTasks();
  } catch (err) {
    alert('回复失败：' + err.message);
  }
}

// 发布公告
document.getElementById('noticeForm').addEventListener('submit', async function(e) {
  e.preventDefault();
  const btn = document.getElementById('noticeBtn');
  btn.disabled = true; btn.innerText = '发布中...';

  const title = document.getElementById('notice-title').value;
  const content = document.getElementById('notice-content').value;

  try {
    await api('notices', 'POST', [{ title, content, important: false }]);
    alert('✅ 公告已发布！居民端刷新即可看到。');
    this.reset();
  } catch (err) {
    alert('发布失败，请检查网络。');
    console.error(err);
  } finally {
    btn.disabled = false; btn.innerText = '发布公告';
  }
});

// 初始化
loadTasks();
</script>
</body>
</html>
